<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ERPlora Hub · Historial de cocina</title>

    <script type="importmap">
      { "imports": { "lit": "https://esm.run/lit@3", "lit/": "https://esm.run/lit@3/" } }
    </script>
    <script src="./_ionic-config.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons/dist/ionicons/ionicons.esm.js"></script>
    <script type="module" src="../../dist/outfitkit.js"></script>

    <style>
      .kitchen-history-page { display: flex; flex-direction: column; gap: 0.75rem; min-height: 100%; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <script type="module">
      import { defineHubPage } from './_hub.js';

      // «Historial» es la auditoría de la línea (`kitchen.logs.list`). Vivía en «Pantalla» hasta
      // que kitchen#4 convirtió esa pestaña en el KDS de verdad; la demo siguió a su componente,
      // `erp-kitchen-history`. Los ajustes de cocina TAMPOCO se pintan aquí: los sirve el
      // formulario genérico del shell desde el bloque `settings` del manifest (ADR-0082).
      //
      // No hay seed de actividad: estas filas de preview respetan exactamente logs_list.sql.
      const LOG_FIXTURE = [
        { "id": "log-1", "order_id": "order-1042", "order_number": "1042", "action": "received", "station_id": "st1", "notes": "Mesa 4 · ronda 1", "created_at": "2026-07-18T20:12:00Z" },
        { "id": "log-2", "order_id": "order-1041", "order_number": "1041", "action": "bumped", "station_id": "st1", "notes": "Lista para servir", "created_at": "2026-07-18T20:09:00Z" },
        { "id": "log-3", "order_id": "order-1040", "order_number": "1040", "action": "served", "station_id": "st2", "notes": "Barra", "created_at": "2026-07-18T20:04:00Z" }
      ];

      let logs = LOG_FIXTURE.map((row) => ({ ...row }));
      const state = { page: 0, pageSize: 50, sort: 'created_at', dir: 'desc', search: '', filters: {} };

      function recordQuery(name, params = {}) {
        document.dispatchEvent(new CustomEvent('erplora:preview-query', { detail: { name, params } }));
      }

      const ACTION_LABELS = {
        received: 'Recibida', started: 'Lanzada', bumped: 'Lista',
        item_bumped: 'Línea lista', item_recalled: 'Línea recuperada',
        served: 'Servida', recalled: 'Recuperada', cancelled: 'Cancelada',
      };

      function badge(text, color) {
        const element = document.createElement('ion-badge');
        element.textContent = text;
        element.color = color;
        return element;
      }

      defineHubPage({
        active: '/m/kitchen/history',
        title: 'Historial',
        body: `
          <div class="kitchen-history-page">
            <ok-data-table id="kitchen-history-table"></ok-data-table>
          </div>
        `,
        setup(doc) {
          const table = doc.getElementById('kitchen-history-table');

          table.columns = [
            {
              key: 'action', header: 'Acción', sortable: true, filterable: true, filterType: 'select',
              options: [
                { value: 'received', label: 'Recibida' },
                { value: 'started', label: 'Lanzada' },
                { value: 'bumped', label: 'Lista' },
                { value: 'item_bumped', label: 'Línea lista' },
                { value: 'item_recalled', label: 'Línea recuperada' },
                { value: 'served', label: 'Servida' },
                { value: 'recalled', label: 'Recuperada' },
                { value: 'cancelled', label: 'Cancelada' },
              ],
              render: (row) => badge(ACTION_LABELS[row.action] || row.action, row.action === 'cancelled' ? 'danger' : row.action === 'served' ? 'success' : 'primary'),
            },
            { key: 'order_number', header: 'Comanda', sortable: true, filterable: true, filterType: 'text', format: (row) => String(row.order_number || row.order_id || '—') },
            { key: 'notes', header: 'Notas', sortable: true, filterable: true, filterType: 'text' },
            { key: 'created_at', header: 'Cuándo', sortable: true, filterable: true, filterType: 'daterange', format: (row) => new Date(row.created_at).toLocaleString('es-ES') },
          ];
          table.serverSide = true;
          table.views = true;
          table.cardTitle = (row) => `#${String(row.order_number || row.order_id || '—')}`;
          table.cardIcon = () => 'restaurant-outline';
          table.searchable = true;
          table.searchPlaceholder = 'Buscar acción, comanda o notas…';
          table.emptyMessage = 'Sin actividad reciente en cocina.';
          table.pageSize = 50;
          table.sort = 'created_at';
          table.sortDir = 'desc';

          function queryPage() {
            recordQuery('kitchen.logs.list', { ...state });
            const term = state.search.trim().toLocaleLowerCase('es');
            const filtered = logs
              .filter((row) => {
                if (term && !`${row.action} ${row.order_number} ${row.order_id} ${row.notes}`.toLocaleLowerCase('es').includes(term)) return false;
                return Object.entries(state.filters).every(([key, value]) => {
                  if (value == null || value === '') return true;
                  if (typeof value === 'object') return true;
                  return key === 'action' ? String(row[key]) === String(value) : String(row[key] || '').toLocaleLowerCase('es').includes(String(value).toLocaleLowerCase('es'));
                });
              })
              .sort((left, right) => {
                const result = String(left[state.sort] || '').localeCompare(String(right[state.sort] || ''), 'es', { numeric: true });
                return state.dir === 'desc' ? -result : result;
              });
            const start = state.page * state.pageSize;
            table.rows = filtered.slice(start, start + state.pageSize);
            table.total = filtered.length;
            table.page = state.page;
            table.pageSize = state.pageSize;
            table.sort = state.sort;
            table.sortDir = state.dir;
          }


          table.addEventListener('pageChange', (event) => { state.page = Number(event.detail) || 0; queryPage(); });
          table.addEventListener('pageSizeChange', (event) => { state.pageSize = Number(event.detail) || 50; state.page = 0; queryPage(); });
          table.addEventListener('sortChange', (event) => { state.sort = event.detail.sort; state.dir = event.detail.dir; queryPage(); });
          table.addEventListener('searchChange', (event) => { state.search = String(event.detail || ''); state.page = 0; queryPage(); });
          table.addEventListener('filterChange', (event) => { state.filters[event.detail.col] = event.detail.value; state.page = 0; queryPage(); });

          queryPage();
        },
      });
    </script>
  </body>
</html>
